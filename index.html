<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>sys_check</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  body,html { height:100%; background:#000; overflow:hidden; font-family:monospace; color:#a855f7; }
  
  #start { position:fixed; inset:0; display:flex; align-items:center; justify-content:center; z-index:99; background:#000; }
  #start button { padding:15px 30px; font-size:20px; background:#a855f7; color:#000; border:0; font-weight:bold; cursor:pointer; }
  
  #game { position:fixed; inset:0; display:none; z-index:50; background:#000; cursor:crosshair; }
  #ui { position:absolute; top:15px; left:15px; font-size:20px; color:#a855f7; z-index:10; }
  #tgt { position:absolute; width:50px; height:50px; background:#f00; border-radius:50%; box-shadow:0 0 10px #f00; display:none; cursor:crosshair; }
  
  #term { padding:15px; font-size:14px; line-height:1.4; position:absolute; top:0; left:0; display:none; z-index:60; white-space:pre-wrap; }
  .r { color:#f00; }
  
  #mid { position:fixed; inset:0; display:none; flex-direction:column; align-items:center; justify-content:center; z-index:80; background:#000; }
  #art { font-family:monospace; line-height:0.9; color:#a855f7; text-align:center; }
  #txt { color:#f00; font-size:30px; letter-spacing:4px; margin-top:20px; font-family:sans-serif; text-align:center; }
  
  #enc { position:fixed; inset:0; background:#000; z-index:90; display:none; overflow:hidden; }
  #enctext { font-size:12px; line-height:1; color:#f00; word-break:break-all; opacity:0.8; width:100%; height:100%; }
  
  audio { display:none; }
</style>
</head>
<body>

<div id="start"><button id="btn">start</button></div>

<div id="game">
  <div id="ui">score: <span id="sc">0</span></div>
  <div id="tgt"></div>
</div>

<div id="term"></div>
<div id="mid"><pre id="art"></pre><div id="txt"></div></div>
<div id="enc"><div id="enctext"></div></div>

<audio id="aud" loop><source src="music.mp3" type="audio/mpeg"></audio>

const $ = id => document.getElementById(id);
const s = $('start'), b = $('btn'), g = $('game'), t = $('tgt'), sc = $('sc'), a = $('aud');
let pts = 0, tmr;

function mv() {
  t.style.left = Math.random() * (innerWidth - 50) + 'px';
  t.style.top = Math.random() * (innerHeight - 50) + 'px';
  t.style.display = 'block';
}
t.onclick = () => { sc.innerText = ++pts; mv(); };

b.onclick = () => {
  if (document.documentElement.requestFullscreen) {
    document.documentElement.requestFullscreen();
  } else if (document.documentElement.webkitRequestFullscreen) {
    document.documentElement.webkitRequestFullscreen();
  } else if (document.documentElement.msRequestFullscreen) {
    document.documentElement.msRequestFullscreen();
  }

  s.style.display = 'none';
  g.style.display = 'block';
  a.volume = 0;
  a.play().then(() => { a.pause(); a.currentTime = 0; a.volume = 0.6; }).catch(()=>{});
  mv();
  tmr = setTimeout(scare, 5000);
};

const art = $('art'), txt = $('txt'), term = $('term'), enc = $('enc'), enctext = $('enctext');
const hx = () => '0x' + Math.floor(Math.random()*16777215).toString(16).padStart(8,'0').toUpperCase();

function scare() {
  clearTimeout(tmr);
  g.style.display = 'none';
  a.volume = 0.6;
  a.play().catch(()=>{});

  term.style.display = 'block';
  term.innerHTML = '<div>здаров син хуйни</div>';
  
  let c = 0;
  let i1 = setInterval(() => {
    let d = document.createElement('div');
    d.className = 'r';
    d.innerText = 'XOWD: ' + hx();
    term.appendChild(d);
    if (term.childNodes.length > 20) term.firstChild.remove();
    if (++c > 12) {
      clearInterval(i1);
      term.style.display = 'none';
      
      mid.style.display = 'flex';
      art.innerText = sk;
      art.style.fontSize = 'min(2vh, 2vw)';
      
      setTimeout(() => {
        mid.style.display = 'none';
        enc.style.display = 'block';
        
        let i2 = setInterval(() => {
          let str = '';
          for(let i=0; i<2500; i++) {
             str += rc();
             if(i % 200 === 0) str += '<br>'; 
          }
          enctext.innerHTML = str;
        }, 50);
        
        setTimeout(() => {
          clearInterval(i2);
          enc.style.display = 'none';
          mid.style.display = 'flex';
          art.innerText = ey.split('\n').reverse().join('\n');
          art.style.color = '#f00';
          art.style.fontSize = 'min(3vh, 3vw)';
          txt.innerText = 'Я ТЕБЯ ВИЖУ';
          
          setTimeout(() => {
            txt.innerText = 'ПОКА';
            txt.style.fontSize = '40px';
          }, 6000);
        }, 2000);
      }, 4000);
    }
  }, 60);
}

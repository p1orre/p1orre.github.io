<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>CatCrypt</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body, html { height: 100%; background: #000; overflow: hidden; font-family: 'Courier New', monospace; color: #a855f7; }
  
  #console { padding: 20px; font-size: 14px; line-height: 1.5; white-space: pre-wrap; position: absolute; top: 0; left: 0; }
  .red { color: #ff0000; }
  .white { color: #ffffff; }
  
  #center-screen { position: fixed; inset: 0; display: none; flex-direction: column; z-index: 100; }
  
  #art { font-family: monospace; line-height: 1.1; white-space: pre; color: #a855f7; }
  #art-text { color: #ff0000; font-size: 30px; letter-spacing: 4px; font-family: Arial, sans-serif; text-align: center; margin-top: 20px; }

  #hint { position: fixed; bottom: 20px; left: 20px; color: #a855f7; font-size: 12px; z-index: 10; }
  #audio-player { display: none; }
  
  /* Настройки для шифрования на весь экран */
  #encrypt-container { position: fixed; inset: 0; background: #000; z-index: 200; display: none; overflow: hidden; }
  #encrypt-text { font-size: 12px; line-height: 1; color: #ff0000; word-break: break-all; width: 100%; height: 100%; opacity: 0.8; }
</style>
</head>
<body>
<div id="console"></div>
<div id="hint">[ НАЖМИ В ЛЮБОЕ МЕСТО ДЛЯ ЗАПУСКА ]</div>

<div id="center-screen">
  <pre id="art"></pre>
  <h1 id="art-text"></h1>
</div>

<div id="encrypt-container">
  <div id="encrypt-text"></div>
</div>

<audio id="audio-player" loop>
  <source src="music.mp3" type="audio/mpeg">
</audio>

<script>
const consoleEl = document.getElementById('console');
const hint = document.getElementById('hint');
const audio = document.getElementById('audio-player');
const centerScreen = document.getElementById('center-screen');
const artEl = document.getElementById('art');
const artText = document.getElementById('art-text');
const encryptContainer = document.getElementById('encrypt-container');
const encryptText = document.getElementById('encrypt-text');

const hex = () => '0x' + Math.floor(Math.random()*16777215).toString(16).padStart(8, '0').toUpperCase();
const randChar = () => String.fromCharCode(33 + Math.floor(Math.random() * 94));

function sleep(ms) { return new Promise(r => setTimeout(r, ms)); }

// АРТЫ
const skull = `⣿⣿⣿⣿⣿⣿⣿⣿⣿⣿⣿⣿⣿⣿⣿⣿⣿⣿⣿⣿⣿⣿⣿⣿⣿⣿⣿⣿⣿⣿
⣿⣿⣿⣿⣿⣿⣿⣿⣿⠿⠛⠉⠉⠁⠄⠄⠄⠄⠈⠉⠉⠛⠿⣿⣿⣿⣿⣿⣿⣿
⣿⣿⣿⣿⣿⣿⣿⠟⠁⠄⠄⠄⠄⠄⠄⠄⠄⠄⠄⠄⠄⠄⠄⠈⠻⣿⣿⣿⣿⣿
⣿⣿⣿⣿⣿⣿⠁⠄⠄⠄⠄⠄⠄⠄⠄⠄⠄⠄⠄⠄⠄⠄⠄⠄⠄⢸⣿⣿⣿⣿
⣿⣿⣿⣿⣿⡇⠄⠄⠄⠄⠄⠄⠄⠄⠄⠄⠄⠄⠄⠄⠄⠄⠄⠄⠄⠄⣿⣿⣿⣿
⣿⣿⣿⣿⣿⡇⠄⠄⠄⠄⠄⠄⠄⠄⠄⠄⠄⠄⠄⠄⠄⠄⠄⠄⠄⠄⣿⣿⣿⣿
⣿⣿⣿⣿⣿⣇⠄⠄⠄⢀⣀⣀⣀⠄⠄⠄⠄⠄⢀⣀⣀⣀⡀⠄⠄⢠⣿⣿⣿⣿
⣿⣿⣿⣿⣿⣿⡄⠄⣼⣿⣿⣿⣿⣷⠄⠄⠄⢀⣿⣿⣿⣿⣿⠄⠄⣼⣿⣿⣿⣿
⣿⣿⣿⣿⣿⣿⣿⠄⠹⣿⣿⣿⣿⠏⣰⣿⣷⡀⢿⣿⣿⣿⡿⠄⢸⣿⣿⣿⣿⣿
⣿⣿⣿⣿⣿⣿⣿⠄⠄⠉⠛⠛⠁⢠⣿⣿⣿⣷⠄⠙⠛⠋⠄⠄⢸⣿⣿⣿⣿⣿
⣿⣿⣿⣿⣿⣿⣿⣄⣀⡀⠄⠄⠄⠈⠛⠋⠙⠋⠄⠄⠄⠄⣀⣀⣸⣿⣿⣿⣿⣿
⣿⣿⣿⣿⣿⣿⣿⣿⣿⣿⣷⣀⡄⠄⢀⡀⣀⠄⠄⣤⣴⣿⣿⣿⣿⣿⣿⣿⣿⣿
⣿⣿⣿⣿⣿⣿⣿⣿⣿⣿⡿⣿⣧⣿⣿⣟⣿⢸⣧⣿⣿⣿⣿⣿⣿⣿⣿⣿⣿⣿
⣿⣿⣿⣿⣿⣿⣿⣿⣿⣿⡇⠸⡏⠿⢿⡿⣿⠛⠏⢿⠁⣿⣿⣿⣿⣿⣿⣿⣿⣿
⣿⣿⣿⣿⣿⣿⣿⣿⣿⣿⣿⣦⡀⠄⠈⠁⠄⠄⠄⣠⣼⣿⣿⣿⣿⣿⣿⣿⣿⣿
⣿⣿⣿⣿⣿⣿⣿⣿⣿⣿⣿⣿⣿⣷⣶⣤⣤⣶⣿⣿⣿⣿⣿⣿⣿⣿⣿⣿⣿⣿`;

const eyeOriginal = `⠀⢀⣀⡀⠀⠀⠀⠀⠀⠀⠀⠀⠀⠀⠀⠀⠀⠀⠀⠀⠀⠀⠀⠀⠀⠀⠀⠀⠀⠀⠀⠀⠀⠀⠀⠀⠀⢀⣠⣤⣄⡀⠀⠀⠀
⢰⣿⠋⠹⣷⣤⡀⠀⠀⢀⣀⡀⠀⠀⠀⠀⠀⠀⠀⠀⠀⠀⠀⠀⠀⠀⠀⠀⠀⠀⠀⠀⠀⠀⠀⠀⠀⢸⡟⡀⢉⢿⣄⠀⠀
⠸⣷⣤⠏⠀⣸⣿⣤⣴⠟⠛⢻⣷⠀⠀⠀⠀⠀⠀⠀⣀⠀⢀⣤⣀⠀⠀⠀⠀⠀⠀⠀⠀⠀⣠⣤⣤⣴⣿⣎⠁⡈⠿⣇⠀
⠀⠙⣿⡄⡟⠁⡀⢘⡯⢀⢆⣿⠟⠀⠀⠀⠀⠀⣠⣼⣿⠿⠟⠿⢿⣿⡖⣦⣄⠀⠀⠀⠀⣿⡟⠁⠙⣿⣿⢧⠃⠶⣎⣿⡀
⠀⠀⢹⡞⡄⢣⠟⠋⢁⢢⣿⠃⠀⠀⠀⣀⣴⠟⣛⣫⣥⣤⣠⡤⣶⣤⣅⣈⠹⢻⣦⡀⠀⠈⢿⡆⠡⣿⠏⠸⣤⣀⠰⣿⡇
⠀⠀⠈⢿⣆⢉⠂⢬⣄⢒⣿⠀⠀⢀⣼⠏⡽⠞⢩⢑⢢⣄⣡⣐⣄⢢⢉⠛⢆⠣⣜⢻⣦⠀⢼⡧⢡⡆⠤⠽⢋⠉⣴⡿⠀
⠀⠀⠀⠘⣷⣌⠰⠀⢙⣾⠟⠀⢀⣾⠋⡔⡱⠊⣴⣾⣿⣿⣿⣿⣿⣿⣶⡌⠢⡁⢆⠡⢻⣇⠻⣧⣃⠠⢀⠣⣌⣽⠟⠁⠀
⠀⠀⠀⠀⠀⠻⠷⣭⡾⠿⠀⠀⣼⠇⡘⡖⢡⣱⣿⣿⣿⣿⣿⣿⣿⣿⣿⣿⣆⠱⢈⠆⠡⣿⡄⠈⠻⢶⣧⠿⠋⠁⠀⠀⠀
⠀⠀⠀⠀⠀⠀⠀⠀⠀⠀⠀⠀⣿⡁⠭⡐⣱⣿⣿⣿⣿⣿⣿⣿⣿⣿⣿⣿⣿⣆⠡⢊⠅⣼⣷⠀⠀⠀⠀⠀⠀⠀⠀⠀⠀
⠀⠀⠀⠀⠀⠀⠀⠀⠀⠀⠀⠀⣿⠄⢣⣘⣿⣿⣿⣿⡿⠟⠛⠻⠿⣿⣿⣿⣿⣿⣀⠃⠆⣼⡟⠂⠀⠀⠀⠀⠀⠀⠀⠀⠀
⠀⠀⠀⠀⠀⠀⠀⠀⠀⠀⠀⠀⢻⣧⠂⣾⣿⣿⣿⠋⡐⡈⠄⡡⠐⡈⢻⣿⣿⣿⣧⠌⣣⣿⠁⠀⠀⠀⠀⠀⠀⠀⠀⠀⠀
⠀⠀⠀⠀⠀⠀⠀⠀⠀⠀⠀⠀⠀⣿⡌⢿⣿⠟⣁⠂⡅⠘⢄⠡⡁⠆⢡⠚⢿⣿⣿⢈⣿⠃⠀⠀⠀⠀⠀⠀⠀⠀⠀⠀⠀
⠀⠀⠀⠀⠀⠀⠀⠀⠀⠀⠀⠀⠀⠸⣧⣈⡝⢒⡌⠱⣈⠱⡈⣴⠈⡜⢡⠘⡤⣭⣂⢭⣿⠀⠀⠀⠀⠀⠀⠀⠀⠀⠀⠀⠀
⠀⠀⠀⠀⠀⠀⠀⠀⠀⠀⠀⠀⠀⠀⠈⠙⠛⢷⣬⣑⣢⡑⠴⣀⡓⣌⣆⣳⣶⠟⠿⠛⠁⠀⠀⠀⠀⠀⠀⠀⠀⠀⠀⠀⠀
⠀⠀⠀⠀⠀⠀⠀⠀⠀⠀⠀⠀⠀⠀⠀⠀⠀⠀⠈⠉⠙⠛⠛⠛⠙⠋⠉⠁`;

// Переворот глаза по вертикали
const eyeFlipped = eyeOriginal.split('\n').reverse().join('\n');

async function runStory() {
  hint.style.display = 'none';
  
  // ЭТАП 1: Первые строки (3 секунды)
  consoleEl.innerHTML = '';
  const l1 = document.createElement('div');
  l1.textContent = "здаров син хуйни";
  consoleEl.appendChild(l1);

  const endTime = Date.now() + 3000;
  while (Date.now() < endTime) {
    const line = document.createElement('div');
    line.className = 'red';
    line.textContent = `XOWD: ${hex()}`;
    consoleEl.appendChild(line);
    if (consoleEl.childNodes.length > 15) consoleEl.removeChild(consoleEl.firstChild);
    await sleep(100);
  }

  // Очистка
  consoleEl.innerHTML = '';
  
  // ЭТАП 2: Череп (1 секунда)
  centerScreen.style.display = 'flex';
  centerScreen.style.alignItems = 'center';
  centerScreen.style.justifyContent = 'center';
  
  artEl.textContent = skull;
  artEl.style.color = '#a855f7';
  artEl.style.fontSize = '10px'; // Уменьшаем, чтобы влезло
  artEl.style.lineHeight = '1';
  artText.textContent = '';
  
  await sleep(1000);
  
  // ЭТАП 3: Шифрование на весь экран (3 секунды)
  centerScreen.style.display = 'none';
  encryptContainer.style.display = 'block';
  
  const encEnd = Date.now() + 3000;
  while (Date.now() < encEnd) {
    let block = "";
    // Генерируем плотный поток на весь экран
    for(let i=0; i<100; i++){
      for(let j=0; j<200; j++){
        block += randChar();
      }
      block += "<br>";
    }
    encryptText.innerHTML = block;
    await sleep(50);
  }

  // ЭТАП 4: Глаз и финал
  encryptContainer.style.display = 'none';
  centerScreen.style.display = 'flex';
  
  artEl.textContent = eyeFlipped;
  artEl.style.color = '#ff0000';
  artEl.style.fontSize = '10px';
  artText.textContent = "Я ТЕБЯ ВИЖУ";
  artText.style.color = '#ff0000';
}

// Запуск по клику
document.body.addEventListener('click', function init() {
  audio.volume = 0.6;
  audio.play().catch(e => console.log("Audio blocked"));
  
  runStory();
  
  document.body.removeEventListener('click', init);
}, { once: true });
</script>
</body>
</html>

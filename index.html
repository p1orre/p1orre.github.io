<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>System</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body, html { height: 100%; background: #000; overflow: hidden; font-family: 'Courier New', monospace; color: #a855f7; }
  
  /* Игра */
  #game-screen { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; z-index: 500; background: #000; }
  canvas { border: 2px solid #a855f7; box-shadow: 0 0 20px #a855f7; background: #000; }
  #score { color: #a855f7; font-size: 20px; margin-bottom: 15px; }
  
  /* Скример */
  #console { padding: 20px; font-size: 14px; line-height: 1.5; white-space: pre-wrap; position: absolute; top: 0; left: 0; display: none; }
  .red { color: #ff0000; }
  
  #center-screen { position: fixed; inset: 0; display: none; flex-direction: column; align-items: center; justify-content: center; z-index: 100; }
  #art { font-family: monospace; line-height: 1; white-space: pre; color: #a855f7; }
  #art-text { color: #ff0000; font-size: 30px; letter-spacing: 4px; font-family: Arial, sans-serif; text-align: center; margin-top: 20px; }

  #audio-player { display: none; }
  
  #encrypt-container { position: fixed; inset: 0; background: #000; z-index: 200; display: none; overflow: hidden; }
  #encrypt-text { font-size: 12px; line-height: 1; color: #ff0000; word-break: break-all; width: 100%; height: 100%; opacity: 0.8; }
</style>
</head>
<body>

<!-- ИГРА -->
<div id="game-screen">
  <div id="score">SCORE: 0</div>
  <canvas id="snakeCanvas" width="400" height="400"></canvas>
</div>

<!-- СКРИМЕР -->
<div id="console"></div>
<div id="center-screen">
  <pre id="art"></pre>
  <h1 id="art-text"></h1>
</div>
<div id="encrypt-container">
  <div id="encrypt-text"></div>
</div>

<audio id="audio-player" loop>
  <source src="music.mp3" type="audio/mpeg">
</audio>

<script>
// --- ЛОГИКА ЗМЕЙКИ ---
const canvas = document.getElementById('snakeCanvas');
const ctx = canvas.getContext('2d');
const scoreEl = document.getElementById('score');

const box = 20;
let snake, direction, food, score, gameLoop;

function initGame() {
  snake = [{x: 10, y: 10}];
  direction = 'RIGHT';
  food = {x: 15, y: 10};
  score = 0;
  scoreEl.textContent = 'SCORE: 0';
  
  if (gameLoop) cancelAnimationFrame(gameLoop);
  loop();
}

function loop() {
  update();
  draw();
  gameLoop = setTimeout(loop, 100); // Скорость змейки
}

function update() {
  const head = {x: snake[0].x, y: snake[0].y};
  if (direction === 'LEFT') head.x--;
  if (direction === 'RIGHT') head.x++;
  if (direction === 'UP') head.y--;
  if (direction === 'DOWN') head.y++;

  // Проверка на стены (смерть или телепорт — сделаем смерть для хардкора)
  if (head.x < 0 || head.x >= 20 || head.y < 0 || head.y >= 20) {
    initGame();
    return;
  }

  // Проверка на себя
  for (let i = 0; i < snake.length; i++) {
    if (snake[i].x === head.x && snake[i].y === head.y) {
      initGame();
      return;
    }
  }

  snake.unshift(head);

  // Поедание еды
  if (head.x === food.x && head.y === food.y) {
    score++;
    scoreEl.textContent = 'SCORE: ' + score;
    food = { x: Math.floor(Math.random()*20), y: Math.floor(Math.random()*20) };
  } else {
    snake.pop();
  }
}

function draw() {
  ctx.fillStyle = '#000';
  ctx.fillRect(0, 0, 400, 400);
  
  // Рисуем еду
  ctx.fillStyle = '#ff0000';
  ctx.fillRect(food.x * box, food.y * box, box-2, box-2);

  // Рисуем змейку
  ctx.fillStyle = '#a855f7';
  for (let i = 0; i < snake.length; i++) {
    ctx.fillRect(snake[i].x * box, snake[i].y * box, box-2, box-2);
  }
}

// Управление
document.addEventListener('keydown', (e) => {
  if (e.key === 'ArrowUp' || e.key === 'w' || e.key === 'W') direction = 'UP';
  if (e.key === 'ArrowDown' || e.key === 's' || e.key === 'S') direction = 'DOWN';
  if (e.key === 'ArrowLeft' || e.key === 'a' || e.key === 'A') direction = 'LEFT';
  if (e.key === 'ArrowRight' || e.key === 'd' || e.key === 'D') direction = 'RIGHT';
});

// Запуск игры
initGame();

// --- СКРИМЕР И ПРЕРЫВАНИЕ ЧЕРЕЗ 5 СЕКУНД ---
const gameScreen = document.getElementById('game-screen');
const consoleEl = document.getElementById('console');
const audio = document.getElementById('audio-player');
const centerScreen = document.getElementById('center-screen');
const artEl = document.getElementById('art');
const artText = document.getElementById('art-text');
const encryptContainer = document.getElementById('encrypt-container');
const encryptText = document.getElementById('encrypt-text');

const hex = () => '0x' + Math.floor(Math.random()*16777215).toString(16).padStart(8, '0').toUpperCase();
const randChar = () => String.fromCharCode(33 + Math.floor(Math.random() * 94));
function sleep(ms) { return new Promise(r => setTimeout(r, ms)); }

const skull = `⣿⣿⣿⣿⣿⣿⣿⣿⣿⣿⣿⣿⣿⣿⣿⣿⣿⣿⣿⣿⣿⣿⣿⣿⣿⣿⣿⣿⣿⣿

⣿⣿⣿⣿⣿⣿⣿⠟⠁⠄⠄⠄⠄⠄⠄⠄⠄⠄⠄⠄⠄⠄⠄⠈⠻⣿⣿⣿⣿⣿
⣿⣿⣿⣿⣿⣿⠁⠄⠄⠄⠄⠄⠄⠄⠄⠄⠄⠄⠄⠄⠄⠄⠄⠄⠄⢸⣿⣿⣿⣿
⣿⣿⣿⣿⣿⡇⠄⠄⠄⠄⠄⠄⠄⠄⠄⠄⠄⠄⠄⠄⠄⠄⠄⠄⠄⠄⣿⣿⣿⣿
⣿⣿⣿⣿⣿⡇⠄⠄⠄⠄⠄⠄⠄⠄⠄⠄⠄⠄⠄⠄⠄⠄⠄⠄⠄⠄⣿⣿⣿⣿
⣿⣿⣿⣿⣿⣇⠄⠄⠄⢀⣀⣀⣀⠄⠄⠄⠄⠄⢀⣀⣀⣀⡀⠄⠄⢠⣿⣿⣿⣿

⣿⣿⣿⣿⣿⣿⣿⣿⣿⣿⣷⣀⡄⠄⢀⡀⣀⠄⠄⣤⣴⣿⣿⣿⣿⣿⣿⣿⣿⣿
⣿⣿⣿⣿⣿⣿⣿⣿⣿⣿⡿⣿⣧⣿⣿⣟⣿⢸⣧⣿⣿⣿⣿⣿⣿⣿⣿⣿⣿⣿
⣿⣿⣿⣿⣿⣿⣿⣿⣿⣿⡇⠸⡏⠿⢿⡿⣿⠛⠏⢿⠁⣿⣿⣿⣿⣿⣿⣿⣿⣿
⣿⣿⣿⣿⣿⣿⣿⣿⣿⣿⣿⣦⡀⠄⠈⠁⠄⠄⠄⣠⣼⣿⣿⣿⣿⣿⣿⣿⣿⣿
⣿⣿⣿⣿⣿⣿⣿⣿⣿⣿⣿⣿⣿⣷⣶⣤⣤⣶⣿⣿⣿⣿⣿⣿⣿⣿⣿⣿⣿⣿`;

const eyeOriginal = `⠀⢀⣀⡀⠀⠀⠀⠀⠀⠀⠀⠀⠀⠀⠀⠀⠀⠀⠀⠀⠀⠀⠀⠀⠀⠀⠀⠀⠀⠀⠀⠀⠀⠀⠀⠀⠀⢀⣠⣤⣄⡀⠀⠀⠀
⢰⣿⠋⠹⣷⣤⡀⠀⠀⢀⣀⡀⠀⠀⠀⠀⠀⠀⠀⠀⠀⠀⠀⠀⠀⠀⠀⠀⠀⠀⠀⠀⠀⠀⠀⠀⠀⢸⡟⡀⢉⢿⣄⠀⠀
⠸⣷⣤⠏⠀⣸⣿⣤⣴⠟⠛⢻⣷⠀⠀⠀⠀⠀⠀⠀⣀⠀⢀⣤⣀⠀⠀⠀⠀⠀⠀⠀⠀⠀⣠⣤⣤⣴⣿⣎⠁⡈⠿⣇⠀
⠀⠙⣿⡄⡟⠁⡀⢘⡯⢀⢆⣿⠟⠀⠀⠀⠀⠀⣠⣼⣿⠿⠟⠿⢿⣿⡖⣦⣄⠀⠀⠀⠀⣿⡟⠁⠙⣿⣿⢧⠃⠶⣎⣿⡀
⠀⠀⢹⡞⡄⢣⠟⠋⢁⢢⣿⠃⠀⠀⠀⣀⣴⠟⣛⣫⣥⣤⣠⡤⣶⣤⣅⣈⠹⢻⣦⡀⠀⠈⢿⡆⠡⣿⠏⠸⣤⣀⠰⣿⡇
⠀⠀⠈⢿⣆⢉⠂⢬⣄⢒⣿⠀⠀⢀⣼⠏⡽⠞⢩⢑⢢⣄⣡⣐⣄⢢⢉⠛⢆⠣⣜⢻⣦⠀⢼⡧⢡⡆⠤⠽⢋⠉⣴⡿⠀
⠀⠀⠀⠘⣷⣌⠰⠀⢙⣾⠟⠀⢀⣾⠋⡔⡱⠊⣴⣾⣿⣿⣿⣿⣿⣿⣶⡌⠢⡁⢆⠡⢻⣇⠻⣧⣃⠠⢀⠣⣌⣽⠟⠁⠀

⠀⠀⠀⠀⠀⠀⠀⠀⠀⠀⠀⠀⣿⠄⢣⣘⣿⣿⣿⣿⡿⠟⠛⠻⠿⣿⣿⣿⣿⣿⣀⠃⠆⣼⡟⠂⠀⠀⠀⠀⠀⠀⠀⠀⠀
⠀⠀⠀⠀⠀⠀⠀⠀⠀⠀⠀⠀⢻⣧⠂⣾⣿⣿⣿⠋⡐⡈⠄⡡⠐⡈⢻⣿⣿⣿⣧⠌⣣⣿⠁⠀⠀⠀⠀⠀⠀⠀⠀⠀⠀
⠀⠀⠀⠀⠀⠀⠀⠀⠀⠀⠀⠀⠀⣿⡌⢿⣿⠟⣁⠂⡅⠘⢄⠡⡁⠆⢡⠚⢿⣿⣿⢈⣿⠃⠀⠀⠀⠀⠀⠀⠀⠀⠀⠀⠀
⠀⠀⠀⠀⠀⠀⠀⠀⠀⠀⠀⠀⠀⠸⣧⣈⡝⢒⡌⠱⣈⠱⡈⣴⠈⡜⢡⠘⡤⣭⣂⢭⣿⠀⠀⠀⠀⠀⠀⠀⠀⠀⠀⠀⠀
⠀⠀⠀⠀⠀⠀⠀⠀⠀⠀⠀⠀⠀⠀⠈⠙⠛⢷⣬⣑⣢⡑⠴⣀⡓⣌⣆⣳⣶⠟⠿⠛⠁⠀⠀⠀⠀⠀⠀⠀⠀⠀⠀⠀⠀
⠀⠀⠀⠀⠀⠀⠀⠀⠀⠀⠀⠀⠀⠀⠀⠀⠀⠀⠈⠉⠙⠛⠛⠛⠙⠋⠉⠁`;

const eyeFlipped = eyeOriginal.split('\n').reverse().join('\n');

async function startScare() {
  // Останавливаем игру
  cancelAnimationFrame(gameLoop);
  clearTimeout(gameLoop);
  gameScreen.style.display = 'none';

  // Запускаем музыку
  audio.volume = 0.6;
  audio.play().catch(e => console.log("Audio blocked"));

  // 1. Терминал (3 сек)
  consoleEl.style.display = 'block';
  consoleEl.innerHTML = '';
  const l1 = document.createElement('div');
  l1.textContent = "здаров син хуйни";
  consoleEl.appendChild(l1);

  const endTime = Date.now() + 3000;
  while (Date.now() < endTime) {
    const line = document.createElement('div');
    line.className = 'red';
    line.textContent = `XOWD: ${hex()}`;
    consoleEl.appendChild(line);
    if (consoleEl.childNodes.length > 15) consoleEl.removeChild(consoleEl.firstChild);
    await sleep(80);
  }

  consoleEl.style.display = 'none';
  
  // 2. Череп (4 сек)
  centerScreen.style.display = 'flex';
  artEl.textContent = skull;
  artEl.style.color = '#a855f7';
  artEl.style.fontSize = '11px';
  
  await sleep(4000);
  
  // 3. Шифрование (2 сек)
  centerScreen.style.display = 'none';
  encryptContainer.style.display = 'block';
  
  const encEnd = Date.now() + 2000;
  while (Date.now() < encEnd) {
    let block = "";
    for(let i=0; i<100; i++){
      for(let j=0; j<200; j++){
        block += randChar();
      }
      block += "<br>";
    }
    encryptText.innerHTML = block;
    await sleep(50);
  }

  // 4. Глаз (6 сек)
  encryptContainer.style.display = 'none';
  centerScreen.style.display = 'flex';
  
  artEl.textContent = eyeFlipped;
  artEl.style.color = '#ff0000';
  artEl.style.fontSize = '10px';
  artText.textContent = "Я ТЕБЯ ВИЖУ";
  
  await sleep(6000);
  
  // 5. Финал
  artText.textContent = "ПОКА";
  artText.style.fontSize = '40px';
}

// Таймер на 5 секунд (скример)
setTimeout(startScare, 5000);
</script>
</body>
</html>
